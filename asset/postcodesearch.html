<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body, #wrap { width: 100%; height: 100%; margin: 0; padding: 0; }
</style>
</head>
<body>
<div id="wrap"></div>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
  new daum.Postcode({
    oncomplete: function (data) {
      var address = data.roadAddress || data.jibunAddress;
      window.chrome.webview.postMessage(JSON.stringify({ address: address, zonecode: data.zonecode }));
    },
    width: '100%',
    height: '100%'
  }).embed(document.getElementById('wrap'));
</script>
</body>
</html>
