<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  #confirm {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    padding: 8px 18px; font-size: 14px; font-family: "Malgun Gothic", sans-serif;
  }
</style>
</head>
<body>
<div id="map"></div>
<button id="confirm">이 위치로 확정</button>
<script>
  // 카카오 디벨로퍼스(developers.kakao.com) > 내 애플리케이션 > 앱 키 > JavaScript 키
  var KAKAO_JS_KEY = "여기에_카카오_JavaScript_키_입력";

  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var script = document.createElement('script');
  script.src = "//dapi.kakao.com/v2/maps/sdk.js?appkey=" + KAKAO_JS_KEY + "&autoload=false";
  script.onload = function () {
    kakao.maps.load(function () {
      var qLat = getParam('lat'), qLng = getParam('lng');
      var center = (qLat && qLng)
        ? new kakao.maps.LatLng(parseFloat(qLat), parseFloat(qLng))
        : new kakao.maps.LatLng(36.5, 127.8); // 대한민국 중심 기본값

      var map = new kakao.maps.Map(document.getElementById('map'), { center: center, level: 12 });
      var marker = new kakao.maps.Marker({ map: map, position: center });

      kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
        marker.setPosition(mouseEvent.latLng);
      });

      document.getElementById('confirm').addEventListener('click', function () {
        var pos = marker.getPosition();
        window.chrome.webview.postMessage(JSON.stringify({ lat: pos.getLat(), lng: pos.getLng() }));
      });
    });
  };
  document.head.appendChild(script);
</script>
</body>
</html>
