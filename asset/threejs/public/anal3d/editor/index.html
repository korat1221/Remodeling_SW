		<script>

			function init() {

				$( "#navigator" ).dialog({
					autoOpen: false, 
					height: 400, 
					width: 350, 
					modal: false,
					title: "Model Summary"
				});

				$( "#img-camera" ).on('click',() => {
					saveScreen();
				});
			}

			function saveScreen() {
				var el = document.querySelector("#viewport canvas");

				this.editor.signals.sceneGraphChanged.dispatch();

			    let dataUrl = el.toDataURL("image/jpeg");

				parent.postMessage({"shot":dataUrl},'*');
			}

			function makeTable(arr, id) {
				var i = -1;
				var html = "<table><tr><th style='width:64px'>외피 ID</th><th>" + id + "</th></tr>";

				while(++i < arr.length) {
					html += "<tr><td>" + arr[i].name.replace(": ","</td><td>") + "</td></tr>";
				}
				html += "</table>";
				return html;
			}

			function open3DModel(uri) {
				const convertURLtoFile = async (url) => {
					const response = await fetch(url);
					const data = await response.blob();
					const ext = url.split(".").pop(); // url 구조에 맞게 수정할 것
					const filename = url.split("/").pop(); // url 구조에 맞게 수정할 것
					const metadata = { type: `image/${ext}` };
					return new File([data], filename, metadata);
				};
				setTimeout(async () => {
					let f = await convertURLtoFile(uri);
					editor.loader.loadFile( f );
				}, 50);
			}
