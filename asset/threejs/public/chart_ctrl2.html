window.addEventListener("message", async (event) => {
  let o = event.data;
  if (o.chart) {
    if (o.donut) {
        drawDonut(o.donut,o.size,o.fontSize);
    }
    else {
        drawChart2(o.data, o.max, o.step, o.legend, o.stacked);
    }
  }
});

function drawDonut(val, size = 87, fontSize = '16px') {
    document.getElementById("cont").innerHTML = `
        <div style="position: relative; width: ${size}px; height: ${size}px; display: flex; justify-content: center; align-items: center;">
            <canvas id="myChart" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"></canvas>
            <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: 900; font-size: ${fontSize};">${parseInt(val)}%</div>
        </div>`;

    document.getElementById("cont").style.backgroundSize = "contain";
    document.getElementById("cont").style.backgroundRepeat = "no-repeat";
    document.getElementById("cont").style.marginTop = "0px";
    document.getElementById("cont").style.display = "flex"; // 추가: flexbox로 중앙 정렬
    document.getElementById("cont").style.justifyContent = "center"; // 추가: 가로 중앙 정렬
    document.getElementById("cont").style.alignItems = "center"; // 추가: 세로 중앙 정렬

    new Chart(document.getElementById("myChart").getContext("2d"), {
        type: 'doughnut',
        data: {
            labels: ['Disabled', 'Enabled'],
            datasets: [{
                label: '--',
                data: [val, 100 - val],
                backgroundColor: ['#4472C4', '#A5A5A5'],
            }]
        },
        options: {
            cutout: '55%', // Adjust this value to change the size of the inner cutout
            plugins: {
                legend: { display: false },
                title: { display: false },
                tooltip: { enabled: false }
            },
            events: ["touchstart", "touchmove", "touchend"],
        },
        plugins: [{
            beforeDraw(chart) {
                const ctx = chart.ctx;
                const chartArea = chart.chartArea;

                // Draw white background in the center
                ctx.save();
                ctx.fillStyle = '#FFFFFF'; // White color
                ctx.beginPath();
                ctx.arc(chartArea.left + (chartArea.right - chartArea.left) / 2,
                        chartArea.top + (chartArea.bottom - chartArea.top) / 2,
                        (chartArea.right - chartArea.left) / 2 * 0.7, // Adjust the radius as needed
                        0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }]
    });
}

function drawChart2(arr, max, step = 500, legend = false, stacked = false) {
    if (arr) {
        let datasets = [], i = -1;

        while(++i < arr.length) {
            let el = arr[i];

            datasets.push({
                label:el.label,
                type: el.type,//'line',
                borderWidth: 1,
                data: el.data, 
                borderColor: el.borderColor,//'#91D050',
                backgroundColor: el.backgroundColor,//'#91D050',
                barPercentage: el.barPercentage,
                yAxisID: el.yAxisID,
                pointStyle: 'circle',
                pointRadius: 3,
                borderDash: el.dash ? [10, 10] : [0, 0],
                tension: el.tension ? el.tension : 0,
            });
        }

        document.getElementById("cont").innerHTML = '<canvas id="myChart" style="width: 100%;height: 100%;"></canvas>';

        new Chart(document.getElementById("myChart").getContext("2d"), {
            data: {
                labels: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
                datasets: datasets
            },
            showTooltips: false,
            options: {
                animation: {
                    duration: 0,
                    onComplete : function(){
                        var ctx = this.ctx;
                        ctx.fillStyle = "#aaa";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "bottom";

                        let i = -1;

                        while(++i < this._metasets.length) {
                            let el = this._metasets[i];

                            if (el.yAxisID === 'y1') {
                                el.data.forEach(function (el2, idx) {
                                    let val = (el._dataset.data[idx] * 100);
                                    ctx.fillText(val.toFixed(1) + '%', el2.x, el2.y);
                                });
                            }
                        }
                    }
                },
                responsive: false,
                scales: {
                    x: {
                        grid: {
                            color:"rgba(0,0,0,0)"
                        },
                        display: true,
                        title: {
                        display: false,
                        },
                        stacked:stacked ? true : false,
                    },
                    y: {
                        display: true,
                        title: {
                            display: false,
                        },
                        grid:{
                            borderColor:'rgba(0,0,0,0)',
                        },
                        min:0,
                        max:max,
                        ticks: {
                            stepSize: step,
                            // Include a dollar sign in the ticks
                            callback: function(value, index, ticks) {
                                return value;
                            }
                        },
                        stacked:stacked ? true : false,
                    },
                    'y1': {
                        display: false,
                        title: {
                            display: false,
                        },
                        grid:{
                            borderColor:'rgba(0,0,0,0)',
                        },
                        min:0,
                        max:1,
                        ticks: {
                            stepSize: 0.1,
                        },
                    }
                },
                plugins: {
                    legend: {
                        display: legend,
                        position:"left",
                        labels: {
                            usePointStyle: true,
                            boxHeight: 6
                        }  
                    },
                    title: {
                        display: false,
                    },
                },
                events: ["touchstart", "touchmove", "touchend"],
            },
        });
    }
}

function drawChart_energyuse(arr, max, step = 500, legend = true, stacked = false) {
    if (arr) {
        let datasets = [], i = -1;

        while (++i < arr.length) {
            let el = arr[i];
            datasets.push({
                label: el.label, 
                type: el.type,
                borderWidth: el.borderWidth,
                data: el.data,
                borderColor: el.borderColor, 
                backgroundColor: el.backgroundColor, 
                barPercentage: el.barPercentage,
                yAxisID: el.yAxisID,
                pointStyle: el.pointStyle,
                pointRadius: el.pointRadius,
                borderDash: el.dash ? [2, 2] : [0, 0],
                tension: el.tension ? el.tension : 0,
            });
        }

        const yAxisTitle = arr[0]?.yAxisTitle || '에너지사용량';

        document.getElementById("cont").innerHTML = `
        <div style="display: flex; width: 100%; height: 100%;">
                <canvas id="myChart" style="width: 80%; height: 100%;"></canvas>
                <div id="legend" style="width: 20%; display: flex; flex-direction: column; margin-top: 40px;"></div>
            </div>
        `;

        const ctx = document.getElementById("myChart").getContext("2d");
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
                datasets: datasets
            },
            options: {
                responsive: false,
                plugins: {
                    legend: {
                        display: false,
                    }
                },
                scales: {
                    x: {
                        stacked: stacked,
                        grid: {
                            display: false
                        }
                    },
                    y: { 
                        stacked: stacked, 
                        min: 0, 
                        max: max,
                        title: {
                            display: true,
                            text: yAxisTitle,
                            align: 'center',
                            padding: {
                                top: 10,
                            },
                            font: {
                                size: 12,
                            },
                            rotation: 0,
                        }
                    },
                },
            },
        });

        const legendContainer = document.getElementById('legend');
        datasets.forEach((dataset, index) => {
            const legendItem = document.createElement('div');
            legendItem.style.display = 'flex';
            legendItem.style.alignItems = 'center';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `checkbox-${index}`;
            checkbox.checked = true;
            checkbox.style.marginTop  = '15px';

            const lineBox = document.createElement('span');
            lineBox.style.width = '20px';
            lineBox.style.height = '2px';
            lineBox.style.backgroundColor = dataset.borderColor;
            lineBox.style.marginRight = '0px';
            lineBox.style.marginTop = '15px';
            lineBox.style.alignSelf = 'center';

            const pointBox = document.createElement('span');
            pointBox.style.width = '10px';
            pointBox.style.height = '10px';
            pointBox.style.borderRadius = '50%';
            pointBox.style.backgroundColor = dataset.borderColor;
            pointBox.style.marginRight = '5px';
            pointBox.style.marginTop = '15px';

            const label = document.createElement('span');
            label.style.marginLeft = '5px';
            label.style.marginTop = '15px';
            label.textContent = dataset.label;
            label.style.textAlign = 'center';
            label.style.fontSize = '12px';

            checkbox.addEventListener('change', (e) => {
                myChart.getDatasetMeta(index).hidden = !e.target.checked;
                myChart.update();
            });

            legendItem.appendChild(checkbox);
            legendItem.appendChild(lineBox);
            legendItem.appendChild(pointBox);
            legendItem.appendChild(label);
            legendContainer.appendChild(legendItem);
        });
    }
}
