<html>
  <script type="text/javascript" src="js/jquery-3.6.0.min.js"></script>
  <body>
    <table style="width: 1116px">
      <tr>
        <td style="text-align: right">
          <button onclick="post2iframe('ifrm-print', {print:true});">
            인쇄
          </button>
        </td>
      </tr>
    </table>
    <hr />
    <iframe
      id="ifrm-print"
      src="print/print1.html"
      style="width: 1116px; height: 100%; border: none"
    ></iframe>
    <script>
      function post2iframe(id, obj) {
        let ifrm = document.getElementById(id);
        if (ifrm) {
          ifrm.contentWindow.postMessage(obj, "*");
        }
      }

      function init(pages, items) {
        post2iframe("ifrm-print", { init: true, pages: pages, items: items });
      }
    </script>
  </body>
</html>
